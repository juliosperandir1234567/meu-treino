<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F6FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meu Treino">
  <title>Meu Treino</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-180.png?v=3" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://dmgyqjyrtnyxqyaeowfa.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700;1,800&family=Space+Grotesk:wght@500;600;700&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* abertura do app: logo entra com impulso, pulsa e some quando a primeira tela fica pronta */
    #abertura { position: fixed; inset: 0; z-index: 50; background: #0A0F05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .45s ease, visibility .45s; }
    #abertura.sai { opacity: 0; visibility: hidden; }
    #abertura .lg { width: 132px; height: 132px; border-radius: 30px; background: url(logo.png) center/cover; box-shadow: 0 0 0 0 rgba(170,248,7,.5); animation: lgEntra .8s cubic-bezier(.2,1.6,.4,1) both, lgPulso 1.6s .8s ease-out infinite; }
    #abertura .nm { color: #fff; font: 700 24px "Space Grotesk", Inter, sans-serif; letter-spacing: .02em; opacity: 0; animation: nmEntra .5s .45s ease-out forwards; }
    #abertura .br { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; opacity: 0; animation: nmEntra .3s .6s forwards; }
    #abertura .br i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #AAF807; animation: brCorre 1s .6s ease-in-out infinite; }
    @keyframes lgEntra { 0% { transform: scale(.3) rotate(-18deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes lgPulso { 0% { box-shadow: 0 0 0 0 rgba(170,248,7,.55); } 100% { box-shadow: 0 0 0 28px rgba(170,248,7,0); } }
    @keyframes nmEntra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes brCorre { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #abertura .lg, #abertura .br i { animation: none; } #abertura .nm, #abertura .br { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="abertura" aria-hidden="true"><span class="lg"></span><span class="nm">Meu Treino</span><span class="br"><i></i></span></div>
  <script>
    // tira a abertura quando a primeira tela aparece (mínimo 0,5 s para a animação, máximo 5 s)
    (function () {
      var t0 = Date.now(), feito = false;
      function sair() { if (feito) return; feito = true; var a = document.getElementById("abertura"); setTimeout(function () { a.classList.add("sai"); setTimeout(function () { a.remove(); }, 500); }, Math.max(0, 500 - (Date.now() - t0))); }
      new MutationObserver(function (m, o) { var app = document.getElementById("app"); if (app && !app.querySelector(".carregando")) { o.disconnect(); sair(); } }).observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(sair, 5000);
    })();
  </script>
  <main id="app"><div class="carregando">Carregando…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="arquivo" accept="image/*" hidden>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
